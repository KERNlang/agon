name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # No submodules: kern_engines was extracted into its own repo
      # (KERNlang/kern-engines) and .gitmodules no longer exists.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Re-export surface guard
        run: npm run guard:reexports

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build:cli

      - name: Verify release SBOM
        run: npm run test:modular-supply-chain

      - name: Run tests
        run: npm run test

      # Regenerated in this job's working tree only, so a PR that changes a package
      # is judged on what a release built from it would ship.
      - name: Pin release channel to the built packages
        run: node scripts/spec/verify-modular-release-set.mjs

      - name: Pack release tarballs and run leak check
        run: npm run release:pack

      - name: Install gate
        run: npm run release:gate
