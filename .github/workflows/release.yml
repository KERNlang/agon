name: Release

# Tag-driven lockstep release: a tag vX.Y.Z stamps one version into every workspace
# package, then publishes every non-private workspace package (49 modular packages,
# the @kernlang/agon-dedup sidecars, and @kernlang/agon last).
#
# @kernlang/agon-core, -forge, -adapter-cli and -mcp are private: tsup inlines them
# into the CLI bundle. @kernlang/agon-engines self-publishes from KERNlang/kern-engines.
#
# The build job holds no publish credential. The publish job runs no repository
# dependency code: it pushes the exact tarballs the install gate approved, using only
# Node built-ins from scripts/release. A re-run resumes a half-failed publish, because
# publish-if-new skips versions already on npm with identical bytes.
#
# Requires an NPM_TOKEN secret on the npm-release environment, with rights to create
# and publish @kernlang/* packages. Set the NPM_PROVENANCE variable to false to publish
# without provenance attestations.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Re-export surface guard
        run: npm run guard:reexports

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Before the stamp: the suite pins the committed version in fixtures.
      - name: Run tests
        run: npm run test

      # Stamps the tag version, reconciles the lockfile, rebuilds, and writes the
      # release channel and SBOM that pin the built tarballs.
      - name: Prepare release from tag
        run: node scripts/release/prepare.mjs "${GITHUB_REF_NAME}"

      - name: Verify release SBOM
        run: npm run test:modular-supply-chain

      - name: Pack release tarballs and run leak check
        run: npm run release:pack

      - name: Install gate
        run: npm run release:gate

      - name: Upload approved tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tarballs
          path: release-tarballs
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download approved tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-tarballs
          path: release-tarballs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
        run: |
          if [ "${NPM_PROVENANCE}" = "false" ]; then
            npm run release
          else
            npm run release -- --provenance
          fi

  # main is branch-protected, so the version bump arrives as a PR. Publishing already
  # succeeded by this point, so a failure here never fails the release.
  sync-main:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open version sync PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="release/sync-v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          node scripts/release/prepare.mjs "${VERSION}"
          git add -u -- packages scripts/spec docs/specs/evidence package-lock.json
          if git diff --cached --quiet; then
            echo "main already at ${VERSION}; nothing to sync."
            exit 0
          fi
          git commit -m "chore(release): @kernlang/agon ${VERSION} (lockstep) [skip ci]"
          git push -f origin "${BRANCH}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "$(printf '{"title":"chore(release): sync version to %s","head":"%s","base":"main","body":"Automated lockstep version sync after publishing %s."}' "${VERSION}" "${BRANCH}" "${VERSION}")" \
            || echo "PR create returned non-zero (likely already open); continuing."
